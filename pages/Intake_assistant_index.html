<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intake Assistant</title>
  <link rel="stylesheet" href="../css/Intake_assistant_styles.css">
  <!-- defer: download now, run after the HTML is ready -->
  <script src="../js/Intake_assistant_app.js" defer></script>
</head>
<body>
  <!-- The whole page is one CSS Grid:
       row 1: page title + the 10 step cards (full width)
       row 2: sidebar | step drop-downs | output -->
  <div class="layout">

    <!-- ===== ROW 1: page title + step cards (the progress map) ===== -->
    <section class="actions-top" aria-labelledby="progress-title">
      <h1 class="page-title">Intake Assistant</h1>

      <!-- Title on the left, "3 of 10 done" on the right -->
      <div class="page-progress-text">
        <h2 class="page-progress-title" id="progress-title">Business startup progress</h2>
        <span class="page-progress-count" id="progress-count">0 of 10 done</span>
      </div>

      <!-- Empty list: Intake_assistant_app.js fills it from the `steps`
           array using the template below. An <ol> because the steps
           happen in order. -->
      <ol class="step-grid" id="step-grid"></ol>

      <!-- Blueprint for one step card (not shown until JS copies it).
           JS adds a class to the card: done = solid bar, now = half bar,
           no class = not started, active = the step open in the middle. -->
      <template id="step-card-template">
        <li>
          <button class="card step-card" type="button">
            <span class="step-bar"></span>
            <span class="card-type step-number"></span>
            <span class="card-title step-title"></span>
            <span class="step-status"></span>
          </button>
        </li>
      </template>
    </section>

    <!-- ===== LEFT: sidebar (client forms checklist + logo) ===== -->
    <aside class="sidebar">
      <!-- Forms to give to the client. Later these will come from Google Drive;
           for now: placeholder names, and "Open" links that go nowhere. -->
      <fieldset class="checklist-group">
        <legend class="checklist-heading">Forms to give to client</legend>
        <div class="checklist">
          <div class="form-row">
            <label class="checklist-item"><input type="checkbox"><span>Form 1</span></label>
            <a class="form-open" href="#">Open</a>
          </div>
          <div class="form-row">
            <label class="checklist-item"><input type="checkbox"><span>Form 2</span></label>
            <a class="form-open" href="#">Open</a>
          </div>
          <div class="form-row">
            <label class="checklist-item"><input type="checkbox"><span>Form 3</span></label>
            <a class="form-open" href="#">Open</a>
          </div>
          <div class="form-row">
            <label class="checklist-item"><input type="checkbox"><span>Form 4</span></label>
            <a class="form-open" href="#">Open</a>
          </div>
        </div>
        <p class="sidebar-hint">Forms will load from Google Drive.</p>
      </fieldset>

      <p class="sidebar-note">Nothing is saved. Refreshing clears everything.</p>

      <!-- Logo pinned to the bottom of the sidebar -->
      <img class="sidebar-logo" src="../assets/img/Intake_assistant_sbdc-logo.svg" alt="America's SBDC">
    </aside>

    <!-- ===== CENTER: the big box with one drop-down per step ===== -->
    <main class="main">
      <section class="form-panel" aria-labelledby="steps-title">
        <h2 class="section-title" id="steps-title">Business startup steps</h2>

        <!-- Empty: JS adds one drop-down per step from the template below -->
        <div class="step-list" id="step-list"></div>

        <!-- Blueprint for one step drop-down.
             <details> opens and closes when its <summary> is clicked.
             name="step" makes them work as a group: opening one closes
             the one that was open. -->
        <template id="step-detail-template">
          <details class="step-detail" name="step">
            <summary class="step-summary">
              <span class="step-summary-title"></span>
              <span class="step-summary-status"></span>
            </summary>

            <div class="step-body">
              <p class="step-todo"></p>

              <!-- Opens the official site in a new tab so nothing typed
                   on this page is lost. noopener: the new tab can't
                   reach back into this page. -->
              <a class="btn step-open" href="" target="_blank" rel="noopener"></a>

              <label class="checklist-item step-done">
                <input type="checkbox">
                <span>Mark this step done</span>
              </label>
            </div>
          </details>
        </template>
      </section>
    </main>

    <!-- ===== RIGHT: output panel ===== -->
    <aside class="output">
      <h2 class="section-title">Output</h2>

      <!-- Progress summary, rebuilt by JS every time a step is ticked -->
      <div class="output-box">
        <h3 class="kv-heading">Startup progress</h3>
        <pre class="output-text" id="progress-summary"></pre>
      </div>
    </aside>

  </div>
</body>
</html>
